name: Test - push-nuget-packages
on:
  workflow_call:
jobs:
  test-push-nuget-packages:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: missing version
            version: ''
            deploy-environment: staging
            api-key: some-key
            expect-failure: true
          - scenario: missing deploy-environment
            version: 1.2.3
            deploy-environment: ''
            api-key: some-key
            expect-failure: true
          - scenario: invalid deploy-environment
            version: 1.2.3
            deploy-environment: not-a-valid-value
            api-key: some-key
            expect-failure: true
          - scenario: missing api-key
            version: 1.2.3
            deploy-environment: staging
            api-key: ''
            expect-failure: true
          - scenario: valid (staging)
            version: 1.2.3
            deploy-environment: staging
            api-key: some-key
            expect-failure: false
          - scenario: valid (production)
            version: 1.2.3
            deploy-environment: production
            api-key: some-key
            expect-failure: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Push NuGet packages
        id: push
        continue-on-error: ${{ matrix.expect-failure }}
        uses: ./.github/actions/push-nuget-packages
        with:
          version: ${{ matrix.version }}
          deploy-environment: ${{ matrix.deploy-environment }}
          api-key: ${{ matrix.api-key }}
          dry-run: true
      - name: Verify
        run: |
          $expectFailure = '${{ matrix.expect-failure }}' -eq 'true'
          $outcome = '${{ steps.push.outcome }}'

          if ($expectFailure)
          {
            if ($outcome -ne 'failure')
            {
              throw "Expected push-nuget-packages to fail for scenario '${{ matrix.scenario }}', but outcome was '$outcome'."
            }
            Write-Output "OK: failed as expected ($outcome)"
          }
          else
          {
            if ($outcome -ne 'success')
            {
              throw "Expected push-nuget-packages to succeed for scenario '${{ matrix.scenario }}', but outcome was '$outcome'."
            }
            Write-Output "OK: succeeded as expected ($outcome)"
          }
