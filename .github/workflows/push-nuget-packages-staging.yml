name: Push NuGet Packages to Staging
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      exclude-package-pattern:
        required: false
        type: string
        default: ''
jobs:
  push-nuget-packages:
    permissions:
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 'latest'
      - name: Download assets from draft release
        run: |
          $name = "${{ inputs.version }}"
          $releases = gh api "repos/${{ github.repository }}/releases" | ConvertFrom-Json
          $release = $releases | Where-Object { $_.name -eq $name } | Select-Object -First 1
          if (-not $release) {
            throw "Could not find a release named '$name'"
          }
          Write-Output "Found draft release id $($release.id) with tag '$($release.tag_name)' for '$name'"

          gh release download $release.tag_name --repo "${{ github.repository }}" --pattern "*.nupkg" --dir nugets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push NuGet packages to staging feed
        run: |
          $getChildItemParams = @{ Path = 'nugets/*'; Include = '*.nupkg' }
          $excludePattern = "${{ inputs.exclude-package-pattern }}"
          if ($excludePattern) { $getChildItemParams.Exclude = $excludePattern }
          $packages = Get-ChildItem @getChildItemParams
          Write-Output "Pushing $($packages.Count) NuGet package(s) to ${{ vars.PARTICULAR_TESTING_FEED_URL }}:"
          $packages | ForEach-Object { Write-Output " - $($_.Name)" }
          foreach ($package in $packages)
          {
            dotnet nuget push $package.FullName --source ${{ vars.PARTICULAR_TESTING_FEED_URL }} --api-key ${{ secrets.FEEDZIO_PUBLISH_API_KEY }}
          }
