name: CI - Workflows
on:
  push:
    branches: [main]
  pull_request:
defaults:
  run:
    shell: pwsh
jobs:
  test-push-docker-images:
    uses: ./.github/workflows/push-docker-images.yml
    with:
      version: 1.2.3
      image-config-file: test/push-docker-images/valid-multi-image.json
      dry-run: true
    secrets: inherit
  test-verify-authorized-user:
    uses: ./.github/workflows/verify-authorized-user.yml
    with:
      actor: test-authorized-user
      authorized-users: test-authorized-user, another-user
  test-generate-release-notes:
    uses: ./.github/workflows/generate-release-notes.yml
    with:
      version: 1.2.3
      dry-run: true
  test-publish-release-notes:
    uses: ./.github/workflows/publish-release-notes.yml
    with:
      version: 1.2.3
      dry-run: true
  test-push-powershell-packages:
    name: test-push-powershell-packages (${{ matrix.deploy-environment }})
    strategy:
      matrix:
        deploy-environment: [staging, production]
    uses: ./.github/workflows/push-powershell-packages.yml
    with:
      version: 1.2.3
      deploy-environment: ${{ matrix.deploy-environment }}
      package-pattern: '*.nupkg'
      dry-run: true
  test-push-release-info-to-aws-s3:
    uses: ./.github/workflows/push-release-info-to-aws-s3.yml
    with:
      version: 1.2.3
      product: TestProduct
      bucket: test-bucket
      dry-run: true
    secrets: inherit
  validate-workflow-tests:
    # So we can add new tests without having to update branch protection rules
    name: Validate workflow test results
    needs: [test-push-docker-images, test-verify-authorized-user, test-generate-release-notes, test-publish-release-notes, test-push-powershell-packages, test-push-release-info-to-aws-s3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        run: |
          $jobs = '${{ toJSON(needs) }}' | ConvertFrom-Json
          $failed = $false

          foreach ($job in $jobs.PSObject.Properties)
          {
            $result = $job.Value.result
            if ($result -ne 'success')
            {
              Write-Output "Job '$($job.Name)' result: $result"
              $failed = $true
            }
          }

          if ($failed)
          {
            Write-Error "One or more jobs did not succeed."
            exit 1
          }

          Write-Output "All jobs succeeded."
