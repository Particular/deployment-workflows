name: CI - Workflows
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
jobs:
  test-authorize-user:
    name: authorized actor
    uses: ./.github/workflows/authorize-user.yml
    with:
      actor: test-authorized-user
      authorized-users: test-authorized-user, another-user

  test-generate-release-notes:
    name: valid version
    uses: ./.github/workflows/generate-release-notes.yml
    with:
      version: 1.2.3
      dry-run: true

  test-publish-release-notes:
    name: valid version
    uses: ./.github/workflows/publish-release-notes.yml
    with:
      version: 1.2.3
      dry-run: true

  validate-workflow-tests:
    # So we can add new tests without having to update branch protection rules
    name: Validate workflow test results
    needs: [test-authorize-user, test-generate-release-notes, test-publish-release-notes]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check all jobs succeeded
        run: |
          $jobs = '${{ toJSON(needs) }}' | ConvertFrom-Json
          $failed = $false

          foreach ($job in $jobs.PSObject.Properties)
          {
            $result = $job.Value.result
            if ($result -ne 'success')
            {
              Write-Output "Job '$($job.Name)' result: $result"
              $failed = $true
            }
          }

          if ($failed)
          {
            Write-Error "One or more jobs did not succeed."
            exit 1
          }

          Write-Output "All jobs succeeded."
