name: Push PowerShell Packages
on:
  workflow_call:
    inputs:
      version:
        description: Release to download package assets from
        required: true
        type: string
      deploy-environment:
        description: The deployment environment that the packages are being published for. Should be 'staging' or 'production'
        required: true
        type: string
      package-pattern:
        required: true
        type: string
      dry-run:
        description: If true, skips real release downloads and the actual push to the gallery, and logs what would happen instead
        required: false
        type: boolean
        default: false
jobs:
  push-powershell-packages:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate inputs
        run: |
          $deployEnvironment = "${{ inputs.deploy-environment }}"
          $validDeployEnvironments = @('staging', 'production')
          if ($validDeployEnvironments -notcontains $deployEnvironment) {
            throw "deploy-environment must be one of: $($validDeployEnvironments -join ', '). Got '$deployEnvironment'."
          }

      - name: Download assets from draft release
        if: inputs.deploy-environment == 'staging'
        run: |
          $name = "${{ inputs.version }}"

          if ('${{ inputs.dry-run }}' -eq 'true')
          {
            Write-Output "[dry-run] Would look up and download assets from draft release named '$name'."
          }
          else
          {
            $releases = gh api "repos/${{ github.repository }}/releases" | ConvertFrom-Json
            $release = $releases | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if (-not $release) {
              throw "Could not find a draft release named '$name'"
            }
            Write-Output "Found draft release id $($release.id) with tag '$($release.tag_name)' for '$name'"
            gh release download $release.tag_name --repo "${{ github.repository }}" --pattern "${{ inputs.package-pattern }}" --dir powershellModules
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to download release assets for tag '$($release.tag_name)'"
            }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download assets from published release
        if: inputs.deploy-environment == 'production'
        run: |
          $version = "${{ inputs.version }}"

          if ('${{ inputs.dry-run }}' -eq 'true')
          {
            Write-Output "[dry-run] Would download assets from published release '$version'."
          }
          else
          {
            gh release download $version --repo "${{ github.repository }}" --pattern "${{ inputs.package-pattern }}" --dir powershellModules
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to download release assets for tag '$version'"
            }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push PowerShell module packages to gallery
        run: |
          if ("${{ inputs.deploy-environment }}" -eq 'production')
          {
            $galleryName = "${{ vars.POWERSHELL_GALLERY_NAME }}"
            $gallerySource = "${{ vars.POWERSHELL_GALLERY_SOURCE_LOCATION }}"
            $galleryKey = "${{ secrets.POWERSHELL_GALLERY_KEY }}"
          }
          else
          {
            $galleryName = "${{ vars.FEEDZ_GALLERY_NAME }}"
            $gallerySource = "${{ vars.FEEDZ_GALLERY_SOURCE_LOCATION }}"
            $galleryKey = "${{ secrets.FEEDZ_GALLERY_KEY }}"
          }

          if ('${{ inputs.dry-run }}' -eq 'true')
          {
            Write-Output "[dry-run] Would push PowerShell module package(s) found under 'powershellModules/' to $galleryName."
          }
          else
          {
            $repo = Get-PSResourceRepository -Name $galleryName -ErrorAction Ignore

            if ($null -eq $repo)
            {
              Register-PSResourceRepository -Name $galleryName -Uri $gallerySource -Trusted
            }
            $psModules = Get-ChildItem powershellModules -File
            Write-Output "Pushing $($psModules.Count) PowerShell module package(s) to ${galleryName}:"
            $psModules | ForEach-Object { Write-Output " - $($_.Name)" }
            $failed = @()
            foreach ($module in $psModules)
            {
              try
              {
                Publish-PSResource -NupkgPath $module.FullName -Repository $galleryName -ApiKey $galleryKey -ErrorAction Stop
              }
              catch
              {
                Write-Output "::error::$($_.Exception.Message)"
                $failed += $module.Name
              }
            }
            if ($failed.Count -gt 0) {
              throw "Failed to push $($failed.Count) package(s): $($failed -join ', ')"
            }
          }
