name: Push Docker Images
on:
  workflow_call:
    inputs:
      version:
        description: Full version of container images to push.
        required: true
        type: string
      image-config-file:
        description: >
          Path (relative to the repository root) to a JSON file listing images to push, each with `name`,
          `readme_filepath`, and `short_description`. `name` is used both as the GHCR source image and as the
          `particular/<name>` Docker Hub repository.
        required: false
        type: string
        default: .github/docker-images.json
      dry-run:
        description: >
          If true, skips registry logins and all actual pushes/description updates with loging of what would have happened
          instead.
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  determine-image-configurations:
    runs-on: ubuntu-latest
    name: Determine image configurations
    defaults:
      run:
        shell: pwsh
    outputs:
      image-tags: ${{ steps.tags.outputs.image-tags }}
      latest: ${{ steps.tags.outputs.latest }}
      image-configs: ${{ steps.parse-image-config.outputs.image-configs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Determine image tags
        id: tags
        uses: $/.github/actions/determine-image-tags
        with:
          version: ${{ inputs.version }}
      - name: Parse and validate image config
        id: parse-image-config
        run: |
          $path = "${{ inputs.image-config-file }}"

          if ( -not (Test-Path $path) )
          {
            throw "image-config-file '$path' was not found in the repository."
          }

          # Wrapping in $() forces an array. Apparently ConvertFrom-Json returns a single element
          # array as just the single element, which breaks things
          $imageConfigs = @(Get-Content -Raw -Path $path | ConvertFrom-Json -ErrorAction Stop)

          if ($imageConfigs.Count -eq 0)
          {
            throw "image-config-file '$path' must contain a non-empty JSON array."
          }

          foreach ($imageConfig in $imageConfigs)
          {
            foreach ($field in @('name', 'readme_filepath', 'short_description'))
            {
              if ([string]::IsNullOrWhiteSpace($imageConfig.$field))
              {
                throw "image-config-file '$path' has an entry missing required field '$field': $($imageConfig | ConvertTo-Json -Compress)"
              }
            }
          }

          # -Compress keeps this on one line; $GITHUB_OUTPUT is line-based and a pretty-printed (multi-line) value would corrupt it.
          $imageConfigsJson = $imageConfigs | ConvertTo-Json -Compress -AsArray
          echo "image-configs=$imageConfigsJson" | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf-8 -Append
  push-to-container-registry:
    needs: determine-image-configurations
    runs-on: ubuntu-latest
    name: Push to container registry
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Log in to GitHub container registry
        if: ${{ !inputs.dry-run }}
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        if: ${{ !inputs.dry-run }}
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        if: ${{ !inputs.dry-run }}
        uses: docker/setup-buildx-action@v4.1.0
      - name: Publish to Docker Hub
        run: |
          # Re-reading the file instead of trying to parse it from outputs is the easiest way to avoid
          # issues with the valid JSON containing characters that break PowerShell's parsing from a variable
          $path = "${{ inputs.image-config-file }}"
          $imageConfigs = @(Get-Content -Raw -Path $path | ConvertFrom-Json -ErrorAction Stop)
          $tags = "${{ needs.determine-image-configurations.outputs.image-tags }}" -Split ','
          $sourceTag = "${{ inputs.version }}"

          foreach ($imageConfig in $imageConfigs)
          {
            $name = $imageConfig.name
            Write-Output "::group::Pushing $name with $tags tags"
            $tagsCLI = $tags -replace "^", "--tag particular/${name}:"
            $cmd = "docker buildx imagetools create $tagsCLI ghcr.io/particular/${name}:$sourceTag"
            Write-Output "Command: $cmd"
            if ('${{ inputs.dry-run }}' -eq 'true')
            {
              Write-Output "[dry-run] Skipping execution."
            }
            else
            {
              Invoke-Expression $cmd
            }
            Write-Output "::endgroup::"
          }
  update-descriptions:
    needs: [determine-image-configurations, push]
    if: ${{ needs.determine-image-configurations.outputs.latest == 'true' && !inputs.dry-run }}
    runs-on: ubuntu-latest
    name: Update Docker Hub description
    strategy:
      matrix:
        image: ${{ fromJSON(needs.determine-image-configurations.outputs.image-configs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Update Docker Hub Description - ${{ matrix.image.name }}
        uses: peter-evans/dockerhub-description@v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: particular/${{ matrix.image.name }}
          readme-filepath: ${{ matrix.image.readme_filepath }}
          short-description: ${{ matrix.image.short_description }}
