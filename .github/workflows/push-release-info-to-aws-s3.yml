name: Push Release Info to AWS S3
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      product:
        required: true
        type: string
      bucket:
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: false
jobs:
  push-release-info-to-aws-s3:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESSKEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRETKEY }}
          aws-region: us-east-1
      - name: Push release info to S3
        run: |
          if ('${{ inputs.dry-run }}' -eq 'true')
          {
            Write-Output "[dry-run] Would fetch release '${{ inputs.version }}', validate it, and upload its info to s3://${{ inputs.bucket }}/$('${{ inputs.product }}'.ToLower()).txt."
          }
          else
          {
            $product = "${{ inputs.product }}"

            try {
                $response = Invoke-WebRequest -Uri https://api.github.com/repos/${{ github.repository }}/releases -UseBasicParsing
            }
            catch {
                Write-Error "Failed to fetch releases: $($_.Exception.Message)"
                exit 1
            }

            # Same list the Octopus step produced: stable X.Y.Z releases that have an exe, newest first
            $obj = ConvertFrom-Json $response.Content -ErrorAction Stop

            $newobj = @($obj |
                Where-Object Draft -eq $false |
                Where-Object Prerelease -eq $false |
                Where-Object tag_name -match '^\d+\.\d+\.\d+$' |
                ForEach-Object {
                    $release = $_ | Select-Object -Property @{Name="tag";Expression={$_."tag_name"}}, @{Name="release";Expression={$_."html_url"}}, @{Name="published";Expression={$_."published_at"}}, assets
                    $release.assets = @($release.assets | Where-Object name -Like "*.exe" | Select-Object -Property name, size, @{Name="download";Expression={$_."browser_download_url"}})
                    $release
                } |
                Where-Object { $_.assets.Count -gt 0 } |
                Sort-Object -Descending { [Version]$_.tag })

            if (-not ($newobj | Where-Object tag -eq "${{ inputs.version }}")) {
                Write-Error "Release ${{ inputs.version }} is not a stable release with exe assets, aborting"
                exit 1
            }

            $json = ConvertTo-Json $newobj -Depth 100 -ErrorAction Stop

            # Write JSON to S3
            $bucket = "${{ inputs.bucket }}"
            $key = "{0}.txt" -f $product.ToLower()
            $tempFile = New-TemporaryFile
            Set-Content -Path $tempFile -Value $json -NoNewline

            aws s3 cp $tempFile "s3://$bucket/$key" --content-type application/json --cache-control max-age=300 --acl public-read
            if ($LASTEXITCODE -ne 0) {
                Write-Error "Upload to S3 failed"
                exit 1
            }

            # Double check upload
            $expectedSize = ([System.Text.Encoding]::UTF8.GetByteCount($json))
            $uploadedSize = aws s3api head-object --bucket $bucket --key $key --query ContentLength --output text
            if ([int]$uploadedSize -ne $expectedSize) {
                Write-Error "Content verification failed"
                exit 1
            }
            else {
                Write-Output ("Updated file now be available at http://{0}/{1} (case sensitive URL)" -f $bucket, $key)
            }
          }
