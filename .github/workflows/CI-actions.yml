name: CI - Actions
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/actions/**'
jobs:
  test-create-draft-release-with-assets:
    uses: ./.github/workflows/test-create-draft-release-with-assets.yml
  test-push-nuget-packages:
    uses: ./.github/workflows/test-push-nuget-packages.yml

  validate-action-tests:
    # So we can add new tests without having to update branch protection rules
    name: Validate action test results
    needs: [test-create-draft-release-with-assets, test-push-nuget-packages]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check all jobs succeeded
        run: |
          $jobs = '${{ toJSON(needs) }}' | ConvertFrom-Json
          $failed = $false

          foreach ($job in $jobs.PSObject.Properties)
          {
            $result = $job.Value.result
            if ($result -ne 'success')
            {
              Write-Output "Job '$($job.Name)' result: $result"
              $failed = $true
            }
          }

          if ($failed)
          {
            Write-Error "One or more jobs did not succeed."
            exit 1
          }

          Write-Output "All jobs succeeded."
