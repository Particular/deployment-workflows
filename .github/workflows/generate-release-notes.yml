name: Generate Release Notes
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: false
jobs:
  generate-release-notes:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: latest
      - name: Setup GitReleaseManager
        run: dotnet tool install --global GitReleaseManager.Tool
      - name: Update draft release notes from milestone
        run: |
          Write-Output "Updating draft release body for ${{ github.event.repository.name }} ${{ inputs.version }} from milestone '${{ inputs.version }}'"

          if ('${{ inputs.dry-run }}' -eq 'true')
          {
            Write-Output "[dry-run] Would run: dotnet-gitreleasemanager create -o ${{ github.repository_owner }} -r ${{ github.event.repository.name }} -m ${{ inputs.version }} -n ${{ inputs.version }} -d .release"
          }
          else
          {
            dotnet-gitreleasemanager create --token $env:GITHUB_TOKEN -o "${{ github.repository_owner }}" -r "${{ github.event.repository.name }}" -m "${{ inputs.version }}" -n "${{ inputs.version }}" -d .release
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
