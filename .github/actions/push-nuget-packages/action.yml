name: Push NuGet Packages
description: Downloads .nupkg release assets and publishes them to a NuGet feed using OIDC trusted publishing or a static API key
inputs:
  version:
    required: true
    description: Release to download package assets from
  deploy-environment:
    required: true
    description: The deployment environment that the packages are being published for. Should be 'staging' or 'production'
  api-key:
    required: true
    description: API key used to authenticate the staging push
  exclude-package-pattern:
    required: false
    default: ''
    description: Glob pattern of package filenames to exclude from the push
  dry-run:
    required: false
    default: 'false'
    description: If true, skips real release downloads, NuGet trusted-publishing login, the actual push to package feed, and logs what would happen instead
runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: pwsh
      run: |
        if (-not "${{ inputs.version }}") {
          throw "version is required."
        }
        $deployEnvironment = "${{ inputs.deploy-environment }}"
        $validDeployEnvironments= @('staging', 'production')
        if ($validDeployEnvironments -notcontains $deployEnvironment) {
          throw "deploy-environment must be one of: $($validDeployEnvironments -join ', '). Got '$releaseState'."
        }
        if (-not "${{ inputs.api-key }}") {
          throw "api-key is required."
        }
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: latest
    - name: Download assets from draft release
      if: inputs.deploy-environment == 'staging'
      shell: pwsh
      run: |
        $name = "${{ inputs.version }}"

        if ('${{ inputs.dry-run }}' -eq 'true')
        {
          Write-Output "[dry-run] Would look up and download assets from draft release named '$name'."
        }
        else
        {
          $releases = gh api "repos/${{ github.repository }}/releases" | ConvertFrom-Json
          $release = $releases | Where-Object { $_.name -eq $name } | Select-Object -First 1
          if (-not $release) {
            throw "Could not find a draft release named '$name'"
          }
          Write-Output "Found draft release id $($release.id) with tag '$($release.tag_name)' for '$name'"
          gh release download $release.tag_name --repo "${{ github.repository }}" --pattern "*.nupkg" --dir nugets
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download release assets for tag '$($release.tag_name)'"
          }
        }
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Download assets from published release
      if: inputs.deploy-environment == 'production'
      shell: pwsh
      run: |
        $version = "${{ inputs.version }}"

        if ('${{ inputs.dry-run }}' -eq 'true')
        {
          Write-Output "[dry-run] Would download assets from published release '$version'."
        }
        else
        {
          gh release download $version --repo "${{ github.repository }}" --pattern "*.nupkg" --dir nugets
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download release assets for tag '$version'"
          }
        }
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Get NuGet trusted publishing API key
      if: inputs.deploy-environment == 'production' && inputs.dry-run != 'true'
      uses: NuGet/login@v1.2.0
      id: login
      with:
        user: 'brandon.ording'
    - name: Push NuGet packages
      shell: pwsh
      run: |
        $source = if ("${{ inputs.deploy-environment }}" -eq 'production') { 'https://api.nuget.org/v3/index.json' } else { 'https://f.feedz.io/particular-software/packages/nuget/index.json' }

        if ('${{ inputs.dry-run }}' -eq 'true')
        {
          Write-Output "[dry-run] Would push NuGet package(s) found under 'nugets/' to $source."
        }
        else
        {
          $getChildItemParams = @{ Path = 'nugets/*'; Include = '*.nupkg' }
          $excludePattern = "${{ inputs.exclude-package-pattern }}"
          if ($excludePattern) { $getChildItemParams.Exclude = $excludePattern }
          $packages = Get-ChildItem @getChildItemParams
          $apiKey = if ("${{ inputs.deploy-environment }}" -eq 'production') { "${{ steps.login.outputs.NUGET_API_KEY }}" } else { "${{ inputs.api-key }}" }
          Write-Output "Pushing $($packages.Count) NuGet package(s) to $source`:"
          $packages | ForEach-Object { Write-Output " - $($_.Name)" }
          $failed = @()
          foreach ($package in $packages)
          {
            dotnet nuget push $package.FullName --source $source --api-key $apiKey --skip-duplicate
            if ($LASTEXITCODE -ne 0) { $failed += $package.Name }
          }
          if ($failed.Count -gt 0) {
            throw "Failed to push $($failed.Count) package(s): $($failed -join ', ')"
          }
        }
