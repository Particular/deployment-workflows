name: Create draft release with assets
description: Creates a draft GitHub release and attaches asset files found under the given paths
inputs:
  asset-paths:
    required: true
    description: Comma-separated paths/globs passed to Get-ChildItem, e.g. "nugets/, powershellModules/, assets/"
  dry-run:
    required: false
    default: 'false'
    description: If true, skips creating the real draft release and only logs what would have been created.
outputs:
  assets:
    description: Comma-separated list of resolved asset file paths that were (or would be) attached
    value: ${{ steps.create.outputs.assets }}
runs:
  using: composite
  steps:
    - name: Create draft release and attach assets
      id: create
      shell: pwsh
      run: |
        $paths = '${{ inputs.asset-paths }}' -split ',' | ForEach-Object { $_.Trim() }
        $assets = (Get-ChildItem -Path $paths -File -Recurse).FullName
        Write-Output "Assets to attach: $assets"
        Write-Output "Creating draft release for ${{ github.event.repository.name }} ${{ github.ref_name }} at commit ${{ github.sha }}"

        if ('${{ inputs.dry-run }}' -eq 'true')
        {
          Write-Output "[dry-run] Skipping gh release create."
        }
        else
        {
          gh release create ${{ github.ref_name }} $assets -d -n "<!-- RELEASE PENDING -->" -t "${{ github.ref_name }}"
        }

        # -join keeps this on one line; $GITHUB_OUTPUT is line-based and a multi-line value would corrupt it.
        $assetsJoined = $assets -join ','
        echo "assets=$assetsJoined" | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf-8 -Append
      env:
        GH_TOKEN: ${{ github.token }}
